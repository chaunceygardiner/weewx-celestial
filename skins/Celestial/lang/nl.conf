# skins/Celestial/lang/nl.conf
#
# Dutch -- Nederlands.  The shared vocabulary -- body names, moon phases,
# hemispheres, compass ordinates, all 88 constellation names, and the
# roster's alt/au terms -- is copied verbatim from weewx-skyfield's
# lang/nl.conf (Beta pending native-speaker review) and must stay in
# step with it (a test pins this).  The handful of strings only this page
# renders (the badge, the dial caption, the roster's motion line) are
# built from that vocabulary.  Corrections welcome at
# https://github.com/chaunceygardiner/weewx-celestial/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Afkortingen van de windstreken voor de breedte/lengte in de koptekst
    hemispheres = N, Z, O, W

[Units]

    [[Ordinates]]

        # Windstreken; de schaal gebruikt N, O, Z en W.
        # Zoals in het nl.conf-bestand van WeeWX zelf.
        directions = N, NNO, NO, ONO, O, OZO, ZO, ZZO, Z, ZZW, ZW, WZW, W, WNW, NW, NNW, N/A

[Almanac]

    # Fasen van de maan, voor $almanac.moon_phase (ook als loopdata-veld
    # van een loop-rapport waarvan dit rapport het doel is).
    # Zoals in het nl.conf-bestand van WeeWX zelf.
    moon_phases = Nieuw, Jonge Maansikkel, Eerste Kwartier, Wassende Maan, Vol, Afnemende Maan, Laatste Kwartier, Asgrauwe Maan

    # Weergavenamen van de hemellichamen, sleutel = tagnaam: de labels
    # van de wijzerplaat, de tabelregels en de tag $almanac.<body>.label.
    sun = Zon
    moon = Maan
    mercury = Mercurius
    venus = Venus
    earth = Aarde
    mars = Mars
    jupiter = Jupiter
    saturn = Saturnus
    uranus = Uranus
    neptune = Neptunus
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Weergavenamen van de sterrenbeelden, sleutel = IAU-afkorting:
    # $almanac.<body>.constellation.label (weewx-skyfield; als
    # loopdata-veld almanac.<body>.constellation.label).
    # $almanac.<body>.constellation geeft altijd de Latijnse naam.
    # De IAU normeert alleen de Latijnse namen; de Nederlandse namen
    # volgen de Lijst van sterrenbeelden van de Nederlandstalige
    # Wikipedia (https://nl.wikipedia.org/wiki/Sterrenbeeld,
    # geraadpleegd 2026-07-30).
