[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The live sky over {location}." = "De hemel boven {location}, live."
    'Celestial <span class="over">over</span> {location}' = 'Hemellichamen <span class="over">boven</span> {location}'
    "updated" = "bijgewerkt"
    "The geocentric · live" = "De geocentrische weergave · live"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installeer {skyfield} (sterk aanbevolen, en vereist voor Proxima Centauri) of PyEphem zodat de almanak de posities en afstanden van dit paneel kan leveren."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Geocentrische kaart: hemellichamen geplaatst naar kompasazimut en logaritmische afstand tot de Aarde"
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "bovenaanzicht — kompasrichting, het oosten rechts · elke ring ×10 in afstand · doorgetrokken&nbsp;=&nbsp;boven de horizon, gestippeld&nbsp;=&nbsp;eronder · de sporen tonen het laatste uur van de beweging"
    "Calculated with WeeWX's built-in almanac" = "Berekend met de ingebouwde almanak van WeeWX"
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Berekend met de uitgebreide almanak van het station (weewx-skyfield of PyEphem)"
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Berekend met Skyfield, de JPL DE421-efemeride en de Hipparcos-sterrencatalogus (bron: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Berekend met weewx-skyfield: Skyfield, de JPL DE421-efemeride en de Hipparcos-sterrencatalogus (bron: ESA)"
    "live via weewx-loopdata" = "live via weewx-loopdata"

