    "{name} pass — {rise} → {set}, peak {alt}°" = "overgang van {name} — {rise} → {set}, hoogste punt {alt}°"
    "Pass sky chart" = "Hemelkaart van de overgang"
    "{date} · {rise} → {set} · peak {alt}°" = "{date} · {rise} → {set} · hoogste punt {alt}°"
