    # ── sky dome panel (mined verbatim from weewx-skyfield's nl.conf where
    #    shared; the eyebrow and the install hint are celestial's own) ────
    "The sky dome · live" = "De hemelkoepel · live"
    "Install {skyfield} so the almanac can draw the live sky dome." = "Installeer {skyfield} zodat de almanak de hemelkoepel live kan tekenen."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Het noorden boven, het oosten links — de oriëntatie van een sterrenkaart, alsof je op je rug omhoog ligt te kijken.  Hoogtecirkels op 30° en 60°; de rand is de horizon."
    "Hover or tap any mark for its coordinates." = "Beweeg de muis over een markering of tik erop voor de coördinaten."
    "Satellites · the next visible pass" = "Satellieten · de volgende zichtbare overgang"
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "verschijnt {rise} · hoogste punt {alt}° {culm} · verdwijnt {set} · {m} min"
    "no visible pass in the coming week" = "geen zichtbare overgang in de komende week"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
    #    page has no next_pass table) ──────────────────────────────────
    "Satellites · the next pass overhead" = "Satellieten · de volgende overgang"
    "no pass in the coming week" = "geen overgang in de komende week"
    "visible" = "zichtbaar"
    "not visible" = "niet zichtbaar"
    "no usable orbital elements — see the weewxd log" = "geen bruikbare baanelementen — zie het weewxd-logboek"

    # ── the Next Visible Pass chart panel (index.html.tmpl; both strings shared
    #    with weewx-skyfield's Sky page, translations verbatim) ─────────
    "The Next Visible Pass · the sky at its peak" = "De volgende zichtbare overgang · de hemel op het hoogste punt"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "De hele hemel zoals die op het hoogste punt van de overgang zal staan, op de datum hierboven — de streepjesboog is de baan van de satelliet, met de tijden van verschijnen en verdwijnen aan de uiteinden.  Alleen sterren die helder genoeg zijn voor een schemerhemel worden getekend: een zichtbare overgang vindt plaats terwijl de hemel half donker is."
    "Sky dome chart" = "Hemelkoepelkaart"
