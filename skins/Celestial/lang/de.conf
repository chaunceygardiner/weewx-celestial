[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The live sky over {location}." = "Der Himmel über {location}, live."
    'Celestial <span class="over">over</span> {location}' = 'Himmelskörper <span class="over">über</span> {location}'
    "updated" = "aktualisiert"
    "The geocentric · live" = "Die geozentrische Ansicht · live"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installieren Sie {skyfield} (dringend empfohlen und für Proxima Centauri erforderlich) oder PyEphem, damit der Almanach die Positionen und Entfernungen dieses Panels liefern kann."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Geozentrische Karte: Körper platziert nach Kompassrichtung und logarithmischer Entfernung von der Erde"
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "Draufsicht — Kompassrichtung, Osten rechts · jeder Ring ×10 in der Entfernung · durchgezogen&nbsp;=&nbsp;über dem Horizont, gestrichelt&nbsp;=&nbsp;darunter · die Spuren zeigen die letzte Stunde der Bewegung"
    "Calculated with WeeWX's built-in almanac" = "Berechnet mit dem eingebauten Almanach von WeeWX"
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Berechnet mit dem erweiterten Almanach der Station (weewx-skyfield oder PyEphem)"
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Berechnet mit Skyfield, der JPL-Ephemeride DE421 und dem Hipparcos-Sternkatalog (Credit: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Berechnet mit weewx-skyfield: Skyfield, der JPL-Ephemeride DE421 und dem Hipparcos-Sternkatalog (Credit: ESA)"
    "live via weewx-loopdata" = "live via weewx-loopdata"

