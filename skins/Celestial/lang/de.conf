    "{name} pass — {rise} → {set}, peak {alt}°" = "{name}-Überflug — {rise} → {set}, Höchststand {alt}°"
    "Pass sky chart" = "Himmelskarte zum Überflug"
    "{date} · {rise} → {set} · peak {alt}°" = "{date} · {rise} → {set} · Höchststand {alt}°"
