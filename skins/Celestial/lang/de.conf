    # ── sky dome panel (mined verbatim from weewx-skyfield's de.conf where
    #    shared; the eyebrow and the install hint are celestial's own) ────
    "The sky dome · live" = "Die Himmelskuppel · live"
    "Install {skyfield} so the almanac can draw the live sky dome." = "Installieren Sie {skyfield}, damit der Almanach die Himmelskuppel live zeichnen kann."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Norden oben, Osten links — die Orientierung einer Himmelskarte, wie auf dem Rücken liegend nach oben geschaut.  Höhenringe bei 30° und 60°; der Rand ist der Horizont."
    "Hover or tap any mark for its coordinates." = "Für die Koordinaten mit der Maus auf eine Marke zeigen oder darauf tippen."
    "Satellites · the next visible pass" = "Satelliten · der nächste sichtbare Überflug"
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "erscheint {rise} · Höchststand {alt}° {culm} · verschwindet {set} · {m} min"
    "no visible pass in the coming week" = "kein sichtbarer Überflug in der kommenden Woche"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
    #    page has no next_pass table) ──────────────────────────────────
    "Satellites · the next pass overhead" = "Satelliten · der nächste Überflug"
    "no pass in the coming week" = "kein Überflug in der kommenden Woche"
    "visible" = "sichtbar"
    "not visible" = "nicht sichtbar"
    "no usable orbital elements — see the weewxd log" = "keine verwendbaren Bahnelemente — siehe weewxd-Log"

    # ── the Next Visible Pass chart panel (index.html.tmpl; both strings shared
    #    with weewx-skyfield's Sky page, translations verbatim) ─────────
    "The Next Visible Pass · the sky at its peak" = "Der nächste sichtbare Überflug · der Himmel am höchsten Punkt"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Der ganze Himmel, wie er am höchsten Punkt des Überflugs stehen wird, am oben genannten Datum — der gestrichelte Bogen ist die Bahn des Satelliten, mit den Zeiten von Erscheinen und Verschwinden an den Enden.  Gezeichnet werden nur Sterne, die für einen Dämmerungshimmel hell genug sind: ein sichtbarer Überflug findet statt, solange der Himmel halbdunkel ist."
    "Sky dome chart" = "Himmelskarte"
