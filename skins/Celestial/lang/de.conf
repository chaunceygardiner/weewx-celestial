# skins/Celestial/lang/de.conf
#
# German -- Deutsch.  The shared vocabulary -- body names, moon phases,
# hemispheres, compass ordinates, all 88 constellation names, and the
# roster's alt/au terms -- is copied verbatim from weewx-skyfield's
# lang/de.conf (native-speaker reviewed, 2026-07-28) and must stay in
# step with it (a test pins this).  The handful of strings only this page
# renders (the badge, the dial caption, the roster's motion line) are
# built from that reviewed vocabulary.  Corrections welcome at
# https://github.com/chaunceygardiner/weewx-celestial/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abkuerzungen der Himmelsrichtungen fuer Breite/Laenge in der Kopfzeile
    hemispheres = N, S, O, W

[Units]

    [[Ordinates]]

        # Himmelsrichtungen; die Skala verwendet N, O, S und W
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSW, SW, WSW, W, WNW, NW, NNW, N/A

[Almanac]

    # Mondphasen, fuer $almanac.moon_phase (auch als loopdata-Feld eines
    # Loop-Reports, dessen Ziel dieser Report ist)
    moon_phases = Neumond, zunehmende Sichel, erstes Viertel, zunehmender Mond, Vollmond, abnehmender Mond, letztes Viertel, abnehmende Sichel

    # Anzeigenamen der Koerper, Schluessel = Tag-Name: die Beschriftungen
    # der Skala, die Zeilen der Tabelle und der $almanac.<body>.label-Tag.
    # Sonne und Mond wie im Seasons-Skin von WeeWX; die Planetennamen nach der
    # Liste der Planeten des Sonnensystems der deutschsprachigen Wikipedia
    # (https://de.wikipedia.org/wiki/Liste_der_Planeten_des_Sonnensystems,
    # abgerufen 2026-07-28).
    sun = Sonne
    moon = Mond
    mercury = Merkur
    venus = Venus
    earth = Erde
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptun
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Anzeigenamen der Sternbilder, Schluessel = IAU-Kuerzel:
    # $almanac.<body>.constellation.label (weewx-skyfield; als
    # loopdata-Feld almanac.<body>.constellation.label).
    # $almanac.<body>.constellation liefert immer den lateinischen Namen.
    # Die IAU normiert nur die lateinischen Namen; die deutschen folgen
    # der Liste der Sternbilder der deutschsprachigen Wikipedia
    # (https://de.wikipedia.org/wiki/Liste_der_Sternbilder, abgerufen
    # 2026-07-28).  Alternativen, die ein Pruefer abwaegen mag:
    # Boo Bootes, Del Delfin, Equ Fohlen, Ind Inder, Pic Malerstaffelei,
    # Vul Fuechschen.
