# skins/Celestial/lang/fr.conf
#
# French -- Français.  Reviewed in full by native speaker Jacques
# Terrettaz (2026-08-15, against 8.3.1): the shared vocabulary in
# weewx-skyfield in 2026-07-30, and this skin's OWN strings -- the badge,
# the captions, the roster and the countdown row -- here.  His
# corrections to the motion line and the pass sub-line are in.
#
# The shared vocabulary -- body names, moon phases, hemispheres, compass
# ordinates, all 88 constellation names, and the roster's alt/au terms --
# is copied verbatim from weewx-skyfield's lang/fr.conf and must stay in
# step with it (a test pins this), so a correction to any of THOSE
# belongs upstream first.  The five strings 8.3.2 added or reworded (the
# dome's health line and its reasons) postdate his read.  Corrections
# welcome at https://github.com/chaunceygardiner/weewx-celestial/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abréviations des points cardinaux pour la latitude/longitude de l'en-tête
    hemispheres = N, S, E, O

[Units]

    [[Ordinates]]

        # Points cardinaux ; l'échelle utilise N, E, S et O.
        # Comme dans le fichier fr.conf de WeeWX lui-même.
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/A

[Almanac]

    # Phases de la Lune, pour $almanac.moon_phase (aussi comme champ
    # loopdata d'un rapport loop dont ce rapport est la cible).
    # Comme dans le fichier fr.conf de WeeWX lui-même.
    moon_phases = Nouvelle, Premier croissant, Premier quartier, Gibbeuse croissante, Pleine, Gibbeuse décroissante, Dernier quartier, Dernier croissant

    # Noms d'affichage des astres, clé = nom du tag : les étiquettes de
    # l'échelle, les lignes du tableau et le tag $almanac.<body>.label.
    sun = Soleil
    moon = Lune
    mercury = Mercure
    venus = Vénus
    earth = Terre
    mars = Mars
    jupiter = Jupiter
    saturn = Saturne
    uranus = Uranus
    neptune = Neptune
    pluto = Pluton
    proxima_centauri = Proxima du Centaure

    # Satellite display names, keyed by the tag names of [Skyfield]
    # [[Satellites]] entries, verbatim from weewx-skyfield.  A
    # satellite without one shows its tag name title-cased.
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Comet display names, keyed by the tag names of [Skyfield]
    # [[Comets]] entries, verbatim from weewx-skyfield.
    halley = Halley
    hale_bopp = Hale-Bopp

    # Noms d'affichage des constellations, clé = abréviation IAU :
    # $almanac.<body>.constellation.label (weewx-skyfield ; comme champ
    # loopdata almanac.<body>.constellation.label).
    # $almanac.<body>.constellation renvoie toujours le nom latin.
    # L'IAU ne normalise que les noms latins ; les noms français suivent
    # la Liste des constellations de la Wikipédia francophone
    # (https://fr.wikipedia.org/wiki/Constellation, consultée 2026-07-28).
    # Alternatives usuelles :
    # Oph Ophiuchus, Sct Écu (forme courte), Pyx Compas du navire.
    # Meteor shower display names, keyed by the shower key, verbatim
