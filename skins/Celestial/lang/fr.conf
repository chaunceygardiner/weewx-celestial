    # ── sky dome panel (mined verbatim from weewx-skyfield's fr.conf where
    #    shared; the eyebrow and the install hint are celestial's own) ────
    "The sky dome · live" = "La voûte céleste · en direct"
    "Install {skyfield} so the almanac can draw the live sky dome." = "Installez {skyfield} pour que l'almanach puisse dessiner la voûte céleste en direct."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Le nord en haut, l'est à gauche — l'orientation d'une carte du ciel, comme allongé sur le dos, les yeux vers le haut.  Cercles de hauteur à 30° et 60° ; le bord est l'horizon."
    "Hover or tap any mark for its coordinates." = "Survolez ou touchez une marque pour lire ses coordonnées."
    "Satellites · the next visible pass" = "Satellites · le prochain passage visible"
    # {rise}, {culm} and {set} here are COMPASS POINTS, not times --
    # rise_azimuth.ordinal_compass and its siblings -- so the line reads
    # "apparaît SSO · culmine a 19 SE · disparait ENE".  Jacques
    # Terrettaz proposed "apparait au {rise}" on 2026-08-15, reading the
    # clock time from the line above; shown the rendered rows, he
    # withdrew it and asked that this stay as it is -- "any french
    # reader will understand".  "au" would be right only for the ten
    # consonant-initial ordinals anyway: the six vowel-initial ones
    # elide (a l'est, a l'ouest), which one format string cannot choose
    # between.  Any preposition here belongs in the
    # ordinal names or the format, not fixed in this value.
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "apparaît {rise} · culmine à {alt}° {culm} · disparaît {set} · {m} min"
    "no visible pass in the coming week" = "aucun passage visible dans la semaine à venir"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
    #    page has no next_pass table) ──────────────────────────────────
    "Satellites · the next pass overhead" = "Satellites · le prochain passage"
    "no pass in the coming week" = "aucun passage dans la semaine à venir"
    "visible" = "visible"
    "not visible" = "non visible"
    "no usable orbital elements — see the weewxd log" = "pas d'éléments orbitaux utilisables — voir le journal de weewxd"

    # ── the Next Visible Pass chart panel (index.html.tmpl; both strings shared
