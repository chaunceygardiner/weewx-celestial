    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Le ciel entier tel qu'il sera au point culminant du passage, à la date indiquée — l'arc en tirets est la trajectoire du satellite, avec les heures d'apparition et de disparition aux extrémités.  Seules les étoiles assez brillantes pour un ciel crépusculaire sont tracées : un passage visible se produit quand le ciel n'est qu'à demi sombre."
    "Sky dome chart" = "Carte du ciel"
