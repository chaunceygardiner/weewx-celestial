[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The live sky over {location}." = "Le ciel au-dessus de {location}, en direct."
    'Celestial <span class="over">over</span> {location}' = 'Les astres <span class="over">au-dessus</span> de {location}'
    "updated" = "mis à jour"
    "The geocentric · live" = "La vue géocentrique · en direct"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installez {skyfield} (fortement recommandé, et requis pour Proxima du Centaure) ou PyEphem pour que l'almanach puisse servir les positions et distances de ce panneau."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Carte géocentrique : les astres placés selon l'azimut boussole et la distance logarithmique à la Terre"
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "vue de dessus — relèvement boussole, l'est à droite · chaque anneau ×10 en distance · trait plein&nbsp;=&nbsp;au-dessus de l'horizon, pointillé&nbsp;=&nbsp;au-dessous · les traînées montrent la dernière heure de mouvement"
    "Calculated with WeeWX's built-in almanac" = "Calculé avec l'almanach intégré de WeeWX"
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Calculé avec l'almanach étendu de la station (weewx-skyfield ou PyEphem)"
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Calculé avec Skyfield, l'éphéméride DE421 du JPL et le catalogue d'étoiles Hipparcos (crédit : ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Calculé avec weewx-skyfield : Skyfield, l'éphéméride DE421 du JPL et le catalogue d'étoiles Hipparcos (crédit : ESA)"
    "live via weewx-loopdata" = "en direct via weewx-loopdata"

