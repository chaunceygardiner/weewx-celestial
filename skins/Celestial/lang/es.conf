[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The live sky over {location}." = "El cielo sobre {location}, en directo."
    'Celestial <span class="over">over</span> {location}' = 'Los astros <span class="over">sobre</span> {location}'
    "updated" = "actualizado"
    "The geocentric · live" = "La vista geocéntrica · en directo"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Instala {skyfield} (muy recomendado, y necesario para Próxima Centauri) o PyEphem para que el almanaque pueda servir las posiciones y distancias de este panel."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Carta geocéntrica: los astros colocados según el acimut de brújula y la distancia logarítmica a la Tierra"
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "vista desde arriba — rumbo de brújula, el este a la derecha · cada anillo ×10 en distancia · trazo continuo&nbsp;=&nbsp;sobre el horizonte, a trazos&nbsp;=&nbsp;debajo · las estelas muestran la última hora de movimiento"
    "Calculated with WeeWX's built-in almanac" = "Calculado con el almanaque integrado de WeeWX"
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Calculado con el almanaque ampliado de la estación (weewx-skyfield o PyEphem)"
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Calculado con Skyfield, las efemérides DE421 del JPL y el catálogo de estrellas Hipparcos (crédito: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Calculado con weewx-skyfield: Skyfield, las efemérides DE421 del JPL y el catálogo de estrellas Hipparcos (crédito: ESA)"
    "live via weewx-loopdata" = "en directo vía weewx-loopdata"

