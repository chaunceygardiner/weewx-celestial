# skins/Celestial/lang/es.conf
#
# Spanish -- Español.  The shared vocabulary -- body names, moon phases,
# hemispheres, compass ordinates, all 88 constellation names, and the
# roster's alt/au terms -- is copied verbatim from weewx-skyfield's
# lang/es.conf (Beta pending native-speaker review) and must stay in
# step with it (a test pins this).  The handful of strings only this page
# renders (the badge, the dial caption, the roster's motion line) are
# built from that vocabulary.  Corrections welcome at
# https://github.com/chaunceygardiner/weewx-celestial/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Abreviaturas de los puntos cardinales para la latitud/longitud de la cabecera
    hemispheres = N, S, E, O

[Units]

    [[Ordinates]]

        # Puntos cardinales; la carta usa N, E, S y O.
        # Como en el archivo es.conf del propio WeeWX.
        directions = N, NNE, NE, ENE, E, ESE, SE, SSE, S, SSO, SO, OSO, O, ONO, NO, NNO, N/A

[Almanac]

    # Fases de la luna, para $almanac.moon_phase (también como campo
    # moon_phase de una instancia de weewx-loopdata cuyo informe de
    # destino sea este).  Como en el archivo es.conf del propio WeeWX.
    moon_phases = Nueva, Creciente, Cuarto creciente, Creciente gibosa, Llena, Menguante gibosa, Cuarto menguante, Menguante

    # Nombres de los astros, clave = nombre del tag: las etiquetas de la
    # carta, las filas de la tabla y el tag $almanac.<body>.label.
    sun = Sol
    moon = Luna
    mercury = Mercurio
    venus = Venus
    earth = Tierra
    mars = Marte
    jupiter = Júpiter
    saturn = Saturno
    uranus = Urano
    neptune = Neptuno
    pluto = Plutón
    proxima_centauri = Próxima Centauri

    # Nombres de las constelaciones, clave = abreviatura IAU:
    # $almanac.<body>.constellation.label (weewx-skyfield; como campo
    # loopdata, almanac.<body>.constellation.label).
    # $almanac.<body>.constellation da siempre el nombre latino.
    # La IAU solo normaliza los nombres latinos; los nombres españoles
    # siguen el Anexo:Constelaciones de la Wikipedia en español
    # (https://es.wikipedia.org/wiki/Anexo:Constelaciones, consultado
    # 2026-07-31), sin el artículo y con la primera forma cuando la
    # lista da dos (Leo o León -> Leo).  Alternativas usuales:
    # Sco Escorpión, Vul Zorra, Dor Dorado, Phe Fénix, Pic Pintor.
    [[Constellations]]
        And = Andrómeda
        Ant = Máquina Neumática
        Aps = Ave del Paraíso
        Aqr = Acuario
        Aql = Águila
        Ara = Altar
        Ari = Aries
