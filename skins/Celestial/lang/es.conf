        Cas = Casiopea
        Cen = Centauro
        Cep = Cefeo
        Cet = Ballena
        Cha = Camaleón
        Cir = Compás
        Col = Paloma
        Com = Cabellera de Berenice
        CrA = Corona Austral
        CrB = Corona Boreal
        Crv = Cuervo
