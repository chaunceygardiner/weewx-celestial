    "Install {skyfield} so the almanac can draw the live sky dome." = "Instala {skyfield} para que el almanaque pueda dibujar la bóveda celeste en directo."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "El norte arriba, el este a la izquierda — la orientación de una carta celeste, como tumbado boca arriba mirando al cielo.  Círculos de altura a 30° y 60°; el borde es el horizonte."
    "Hover or tap any mark for its coordinates." = "Pasa el cursor sobre una marca, o tócala, para ver sus coordenadas."
    "Satellites · the next visible pass" = "Satélites · el próximo paso visible"
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "aparece {rise} · culmina a {alt}° {culm} · desaparece {set} · {m} min"
    "no visible pass in the coming week" = "ningún paso visible en la próxima semana"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
    #    page has no next_pass table) ──────────────────────────────────
    "Satellites · the next pass overhead" = "Satélites · el próximo paso"
    "no pass in the coming week" = "ningún paso en la próxima semana"
    "visible" = "visible"
    "not visible" = "no visible"
    "no usable orbital elements — see the weewxd log" = "sin elementos orbitales utilizables — consulta el registro de weewxd"

    # ── the Next Visible Pass chart panel (index.html.tmpl; both strings shared
    #    with weewx-skyfield's Sky page, translations verbatim) ─────────
    "The Next Visible Pass · the sky at its peak" = "El próximo paso visible · el cielo en su punto más alto"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "El cielo entero tal como estará en el punto más alto del paso, en la fecha indicada arriba — el arco discontinuo es la trayectoria del satélite, con las horas de aparición y desaparición en los extremos.  Solo se dibujan las estrellas lo bastante brillantes para un cielo crepuscular: un paso visible ocurre mientras el cielo está a medio oscurecer."
    "Sky dome chart" = "Carta celeste"
    "{name} — alt {alt}°, az {az}°, mag {mag}" = "{name} — altura {alt}°, acimut {az}°, mag {mag}"
    "{name} — alt {alt}°, az {az}°" = "{name} — altura {alt}°, acimut {az}°"
    "{name} — alt {alt}°, az {az}° — in shadow" = "{name} — altura {alt}°, acimut {az}° — en la sombra de la Tierra"
    "{name} — alt {alt}°, az {az}°, {pct}% illuminated" = "{name} — altura {alt}°, acimut {az}°, {pct} % iluminada"
    "{name} pass — {rise} → {set}, peak {alt}°" = "paso de {name} — {rise} → {set}, culminación {alt}°"
    "Pass sky chart" = "Carta celeste del paso"
    "{date} · {rise} → {set} · peak {alt}°" = "{date} · {rise} → {set} · culminación {alt}°"
    "%b %-d" = "%-d %b"
