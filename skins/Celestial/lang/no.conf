[Texts]

    # ── page prose (index.html.tmpl; the panels' strings render from
    #    celestial_page.py) ───────────────────────────────────────────────
    "The live sky over {location}." = "Himmelen over {location}, live."
    'Celestial <span class="over">over</span> {location}' = 'Himmellegemer <span class="over">over</span> {location}'
    "updated" = "oppdatert"
    "The geocentric · live" = "Den geosentriske visningen · live"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installer {skyfield} (sterkt anbefalt, og påkrevd for Proxima Centauri) eller PyEphem slik at almanakken kan levere posisjonene og avstandene til dette panelet."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Geosentrisk kart: himmellegemer plassert etter kompassasimut og logaritmisk avstand fra Jorden"
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "sett ovenfra — kompassretning, øst til høyre · hver ring ×10 i avstand · heltrukket&nbsp;=&nbsp;over horisonten, stiplet&nbsp;=&nbsp;under · sporene viser den siste timens bevegelse"
    "Calculated with WeeWX's built-in almanac" = "Beregnet med den innebygde almanakken i WeeWX"
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Beregnet med stasjonens utvidede almanakk (weewx-skyfield eller PyEphem)"
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beregnet med Skyfield, JPL-efemeriden DE421 og Hipparcos-stjernekatalogen (kilde: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beregnet med weewx-skyfield: Skyfield, JPL-efemeriden DE421 og Hipparcos-stjernekatalogen (kilde: ESA)"
    "live via weewx-loopdata" = "live via weewx-loopdata"

