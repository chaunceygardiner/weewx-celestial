    "Proxima" = "Proxima"

    # ── sky dome panel (mined verbatim from weewx-skyfield's no.conf where
    #    shared; the eyebrow and the install hint are celestial's own) ────
    "The sky dome · live" = "Himmelkuppelen · live"
    "Install {skyfield} so the almanac can draw the live sky dome." = "Installer {skyfield} slik at almanakken kan tegne himmelkuppelen live."
    "The page's fragment set is missing or invalid in [CelestialFragments] — see the weewxd log." = "Sidens fragmentsett mangler i [CelestialFragments] eller er ugyldig — se weewxd-loggen."
    "This page's report does not name the {panel} panel in celestial_panels, so its live fields are not declared — name it, re-run weectl extension install and restart weewxd." = "Rapporten til denne siden nevner ikke panelet {panel} i celestial_panels, så live-feltene er ikke deklarert — nevn det, kjør weectl extension install på nytt og start weewxd på nytt."
    "This page's report carries an invalid celestial_panels — see the weewxd log." = "Rapporten til denne siden har en ugyldig celestial_panels — se weewxd-loggen."
    "This page's report's field declaration is out of date — re-run weectl extension install (or the --add-satellite/--add-comet utility) and restart weewxd." = "Feltdeklarasjonen til rapporten for denne siden er utdatert — kjør weectl extension install (eller verktøyet --add-satellite/--add-comet) på nytt og start weewxd på nytt."
    "The sky dome could not be drawn — see the weewxd log." = "Himmelkuppelen kunne ikke tegnes — se weewxd-loggen."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Nord øverst, øst til venstre — stjernekartets orientering, som om du ligger på ryggen og ser opp.  Høyderinger ved 30° og 60°; kanten er horisonten."
    "Hover or tap any mark for its coordinates." = "Hold pekeren over eller trykk på et merke for å se koordinatene."
    "Satellites · the next visible pass" = "Satellitter · neste synlige passasje"
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "kommer til syne {rise} · høyest {alt}° {culm} · forsvinner {set} · {m} min"
    "no visible pass in the coming week" = "ingen synlig passasje den kommende uken"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
    #    page has no next_pass table) ──────────────────────────────────
    "Satellites · the next pass overhead" = "Satellitter · neste passasje"
    "no pass in the coming week" = "ingen passasje den kommende uken"
    "visible" = "synlig"
    "not visible" = "ikke synlig"
    "no usable orbital elements — see the weewxd log" = "ingen brukbare baneelementer — se weewxd-loggen"

    # ── the Next Visible Pass chart panel (celestial_page.py; both strings shared
    #    with weewx-skyfield's Sky page, translations verbatim) ─────────
    "The Next Visible Pass · the sky at its peak" = "Neste synlige passasje · himmelen på det høyeste punktet"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Hele himmelen slik den vil stå ved passasjens høyeste punkt, på datoen ovenfor — den stiplede buen er satellittens bane, med tidspunktene for når den kommer til syne og forsvinner i endene.  Bare stjerner som er klare nok for en tussmørkehimmel tegnes: en synlig passasje skjer mens himmelen er halvmørk."
    "Sky dome chart" = "Kart over himmelkuppelen"
    "{name} — alt {alt}°, az {az}°, mag {mag}" = "{name} — høyde {alt}°, az {az}°, mag {mag}"
    "{name} — alt {alt}°, az {az}°" = "{name} — høyde {alt}°, az {az}°"
    "{name} — alt {alt}°, az {az}° — in shadow" = "{name} — høyde {alt}°, az {az}° — i jordskyggen"
    "{name} — alt {alt}°, az {az}°, {pct}% illuminated" = "{name} — høyde {alt}°, az {az}°, {pct}% belyst"
    "{name} pass — {rise} → {set}, peak {alt}°" = "{name}-passasje — {rise} → {set}, høyest {alt}°"
    "Pass sky chart" = "Himmelkart for passasjen"
    "{date} · {rise} → {set} · peak {alt}°" = "{date} · {rise} → {set} · høyest {alt}°"
    "%b %-d" = "%-d. %b"
    "%a %b %-d" = "%a %-d. %b"
    "overhead now" = "på himmelen nå"
    "in {m} min" = "om {m} min"
    "in {h} h" = "om {h} t"
    "in {n} day" = "om {n} dag"
    "in {n} days" = "om {n} dager"
    "just set" = "nettopp forsvunnet"

