    "receding" = "fjerner seg"
    "approaching" = "nærmer seg"
    "LIVE" = "LIVE"
    "{age}s ago" = "for {age} s siden"
    "NO DATA (HTTP {status}) — check loop_data_file" = "INGEN DATA (HTTP {status}) — sjekk loop_data_file"
