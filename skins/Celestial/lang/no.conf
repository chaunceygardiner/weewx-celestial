# skins/Celestial/lang/no.conf
#
# Norwegian (Bokmål) -- Norsk.  The shared vocabulary -- body names, moon
# phases, hemispheres, compass ordinates, all 88 constellation names, and
# the dome and pass strings shared with weewx-skyfield's Sky page -- is
# copied verbatim from weewx-skyfield's lang/no.conf (Beta pending
# native-speaker review) and must stay in step with it (a test pins
# this).  The handful of strings only this page renders (the badge, the
# dial caption, the roster's motion line) are built from that
# vocabulary.  Corrections welcome at
# https://github.com/chaunceygardiner/weewx-celestial/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Hemisphere abbreviations, for the latitude/longitude in the header
    hemispheres = N, S, Ø, V

[Units]

    [[Ordinates]]

        # Compass ordinal directions; the dial uses N, Ø, S and V.
        # As in WeeWX's own no.conf.
        directions = N, NNØ, NØ, ØNØ, Ø, ØSØ, SØ, SSØ, S, SSV, SV, VSV, V, VNV, NV, NNV, N/A

[Almanac]

    # Moon phase names ($almanac.moon_phase -- and any moon_phase loop
    # field of a weewx-loopdata instance whose target report is this one).
    # As in WeeWX's own no.conf.
    moon_phases = Nymåne, Voksende sigd, Første kvarter, Voksende måne, Fullmåne, Avtakende måne, Siste kvarter, Avtakende sigd

    # Body display names, keyed by tag name: the dial labels, the roster
    # rows, and the $almanac.<body>.label tag.  proxima_centauri is the
    # full name; the dial and roster use the short [Texts] "Proxima".
    sun = Solen
    moon = Månen
    mercury = Merkur
    venus = Venus
    earth = Jorden
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptun
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Satellite display names, keyed by the tag names of [Skyfield]
    # [[Satellites]] entries, verbatim from weewx-skyfield.  A
    # satellite without one shows its tag name title-cased.
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Comet display names, keyed by the tag names of [Skyfield]
    # [[Comets]] entries, verbatim from weewx-skyfield.
    halley = Halley
    hale_bopp = Hale-Bopp

    # Constellation display names, keyed by IAU abbreviation, for the
    # $almanac.<body>.constellation.label tag (weewx-skyfield) and its
    # loopdata form almanac.<body>.constellation.label.  The page does not
    # render these itself; they ship so a report in this language serves
    # the full set.  The IAU standardizes only the Latin names; the
    # Norwegian names follow the Norwegian Wikipedia's Liste over
    # stjernebilder (https://no.wikipedia.org/wiki/Liste_over_stjernebilder,
    # consulted 2026-08-06).
    # Meteor shower display names, keyed by the shower key, verbatim
    # from weewx-skyfield: almanac.next_meteor_shower.label and the
    # shower countdown chip.
    [[MeteorShowers]]
        quadrantids = Kvadrantider
        lyrids = Lyrider
        eta_aquariids = Eta-akvarider
        delta_aquariids = Sørlige delta-akvarider
        perseids = Perseider
        draconids = Drakonider
        orionids = Orionider
        southern_taurids = Sørlige taurider
        northern_taurids = Nordlige taurider
        leonids = Leonider
        geminids = Geminider
        ursids = Ursider

