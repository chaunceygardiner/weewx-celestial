[Texts]

    # ── page prose (index.html.tmpl; the panels' strings render from
    #    celestial_page.py) ───────────────────────────────────────────────
    "The live sky over {location}." = "Il cielo sopra {location}, in diretta."
    'Celestial <span class="over">over</span> {location}' = 'Gli astri <span class="over">sopra</span> {location}'
    "updated" = "aggiornato"
    "The geocentric · live" = "La vista geocentrica · in diretta"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installa {skyfield} (fortemente consigliato, e necessario per Proxima Centauri) o PyEphem perché l'almanacco possa servire le posizioni e le distanze di questo pannello."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Carta geocentrica: gli astri collocati secondo l'azimut di bussola e la distanza logaritmica dalla Terra"
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "vista dall'alto — rilevamento di bussola, l'est a destra · ogni anello ×10 in distanza · tratto continuo&nbsp;=&nbsp;sopra l'orizzonte, tratteggiato&nbsp;=&nbsp;sotto · le scie mostrano l'ultima ora di movimento"
    "Calculated with WeeWX's built-in almanac" = "Calcolato con l'almanacco integrato di WeeWX"
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Calcolato con l'almanacco esteso della stazione (weewx-skyfield o PyEphem)"
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Calcolato con Skyfield, le effemeridi DE421 del JPL e il catalogo stellare Hipparcos (credito: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Calcolato con weewx-skyfield: Skyfield, le effemeridi DE421 del JPL e il catalogo stellare Hipparcos (credito: ESA)"
    "live via weewx-loopdata" = "in diretta via weewx-loopdata"

