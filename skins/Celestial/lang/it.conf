    # ── sky dome panel (mined verbatim from weewx-skyfield's it.conf where
    #    shared; the eyebrow and the install hint are celestial's own) ────
    "The sky dome · live" = "La volta celeste · in diretta"
    "Install {skyfield} so the almanac can draw the live sky dome." = "Installa {skyfield} perché l'almanacco possa disegnare la volta celeste in diretta."
    "The page's fragment set is missing or invalid in [CelestialFragments] — see the weewxd log." = "Il set di frammenti della pagina manca in [CelestialFragments] o non è valido — consulta il log di weewxd."
    "This page's report does not name the {panel} panel in celestial_panels, so its live fields are not declared — name it, re-run weectl extension install and restart weewxd." = "Il report di questa pagina non nomina il pannello {panel} in celestial_panels, quindi i suoi campi live non sono dichiarati — nominalo, riesegui weectl extension install e riavvia weewxd."
    "This page's report carries an invalid celestial_panels — see the weewxd log." = "Il report di questa pagina ha un celestial_panels non valido — vedi il log di weewxd."
    "This page's report's field declaration is out of date — re-run weectl extension install (or the --add-satellite/--add-comet utility) and restart weewxd." = "La dichiarazione dei campi del report di questa pagina non è aggiornata — riesegui weectl extension install (o l'utilità --add-satellite/--add-comet) e riavvia weewxd."
    "The sky dome could not be drawn — see the weewxd log." = "Impossibile disegnare la volta celeste — consulta il log di weewxd."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Il nord in alto, l'est a sinistra — l'orientamento delle carte celesti, come sdraiati sulla schiena a guardare in su.  Cerchi di altezza a 30° e 60°; il bordo è l'orizzonte."
    "Hover or tap any mark for its coordinates." = "Passa il cursore su un segno, o toccalo, per vederne le coordinate."
    "Satellites · the next visible pass" = "Satelliti · il prossimo passaggio visibile"
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "compare {rise} · culmina a {alt}° {culm} · scompare {set} · {m} min"
    "no visible pass in the coming week" = "nessun passaggio visibile nella prossima settimana"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
