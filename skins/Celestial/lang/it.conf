    "no pass in the coming week" = "nessun passaggio nella prossima settimana"
    "visible" = "visibile"
    "not visible" = "non visibile"
    "no usable orbital elements — see the weewxd log" = "nessun elemento orbitale utilizzabile — consulta il log di weewxd"

    # ── the Next Visible Pass chart panel (celestial_page.py; both strings shared
    #    with weewx-skyfield's Sky page, translations verbatim) ─────────
    "The Next Visible Pass · the sky at its peak" = "Il prossimo passaggio visibile · il cielo al punto più alto"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Il cielo intero come sarà al punto più alto del passaggio, alla data indicata sopra — l'arco tratteggiato è la traiettoria del satellite, con gli orari della sua comparsa e della sua scomparsa alle estremità.  Sono disegnate solo le stelle abbastanza brillanti per un cielo crepuscolare: un passaggio visibile avviene mentre il cielo è a metà buio."
    "Sky dome chart" = "Carta della volta celeste"
    "{name} — alt {alt}°, az {az}°, mag {mag}" = "{name} — altezza {alt}°, azimut {az}°, mag {mag}"
    "{name} — alt {alt}°, az {az}°" = "{name} — altezza {alt}°, azimut {az}°"
    "{name} — alt {alt}°, az {az}° — in shadow" = "{name} — altezza {alt}°, azimut {az}° — nell'ombra della Terra"
    "{name} — alt {alt}°, az {az}°, {pct}% illuminated" = "{name} — altezza {alt}°, azimut {az}°, {pct}% illuminata"
    "{name} pass — {rise} → {set}, peak {alt}°" = "passaggio di {name} — {rise} → {set}, culmine {alt}°"
    "Pass sky chart" = "Carta del cielo per il passaggio"
    "{date} · {rise} → {set} · peak {alt}°" = "{date} · {rise} → {set} · culmine {alt}°"
    "%b %-d" = "%-d %b"
    "%a %b %-d" = "%a %-d %b"
    "overhead now" = "ora in cielo"
