[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The live sky over {location}." = "Den aktuelle himmel over {location}."
    'Celestial <span class="over">over</span> {location}' = 'Himlen <span class="over">over</span> {location}'
    "updated" = "opdateret"
    "The geocentric · live" = "Geocentrisk (live)"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installer {skyfield} (stærkt anbefalet og påkrævet for Proxima Centauri) eller PyEphem, så almanakken kan levere positioner og afstande til dette panel."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Geocentrisk kort: himmellegemer placeret efter kompasazimut og logaritmisk afstand fra Jorden."
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "Planvisning — himmellegemerne vises efter kompasretning, med øst mod højre. Ringene repræsenterer afstande, der øges ti gange fra ring til ring. Optrukne symboler angiver objekter over horisonten, mens stiplede symboler angiver objekter under horisonten. Sporene viser bevægelsen gennem den seneste time."
    "Calculated with WeeWX's built-in almanac" = "Beregnet med WeeWX's indbyggede almanak."
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Beregningerne er udført ved hjælp af stationens udvidede almanak (weewx-skyfield eller PyEphem)."
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beregnet med Skyfield, JPL's DE421 ephemeris og Hipparcos stjernekatalog (Credit: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beregnet med weewx-skyfield: Skyfield, JPL's DE421 ephemeris og Hipparcos stjernekatalog (Credit: ESA)"
    "live via weewx-loopdata" = "live via weewx-loopdata"

    # ── live strings (realtime_updater.inc; the roster's first paint in
    #    index.html.tmpl uses the same keys) ────────────────────────────
    "alt {alt}°" = "højde {alt}°"
    "below horizon" = "under horisonten"
    "{dist} au" = "{dist} au"
    "receding" = "fjerner sig"
    "approaching" = "nærmer sig"
    "LIVE" = "LIVE"
    "{age}s ago" = "{age}s siden"
    "NO DATA (HTTP {status}) — check loop_data_file" = "NO DATA (HTTP {status}) — check loop_data_file"
    "BAD DATA — check loop_data_file" = "BAD DATA — check loop_data_file"
    "OFFLINE" = "OFFLINE"
    "CLICK-ME" = "CLICK-ME"
    "{ly} ly" = "{ly} ly"
    "Proxima" = "Proxima"

    # ── sky dome panel (mined verbatim from weewx-skyfield's da.conf where
    #    shared; the eyebrow and the install hint are celestial's own,
    #    following Gert Andersen's "(live)" idiom) ───────────────────────
    "The sky dome · live" = "Himmelkuplen (live)"
    "Install {skyfield} so the almanac can draw the live sky dome." = "Installer {skyfield}, så almanakken kan tegne himmelkuplen live."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Nord øverst, øst til venstre — stjernekortets orientering, som hvis du ligger på ryggen og kigger op mod himlen. Højderinge ved 30° og 60°; kanten markerer horisonten."
    "Hover or tap any mark for its coordinates." = "Hold markøren over eller tryk på en markering for at se dens koordinater."
    "Satellites · the next visible pass" = "Satellitter · den næste synlige passage"
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "kommer til syne {rise} · højest {alt}° {culm} · forsvinder {set} · {m} min"
    "no visible pass in the coming week" = "ingen synlig passage i den kommende uge"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
    #    page has no next_pass table) ──────────────────────────────────
    "Satellites · the next pass overhead" = "Satellitter · den næste passage"
    "no pass in the coming week" = "ingen passage i den kommende uge"
    "visible" = "synlig"
    "not visible" = "ikke synlig"
    "no usable orbital elements — see the weewxd log" = "ingen brugbare baneelementer — se weewxd-loggen."

    # ── the Next Visible Pass chart panel (index.html.tmpl; both strings shared
    #    with weewx-skyfield's Sky page, translations verbatim) ─────────
    "The Next Visible Pass · the sky at its peak" = "Den næste synlige passage · himlen på det højeste punkt"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Hele himlen, som den vil stå ved passagens højeste punkt, på datoen ovenfor — den stiplede bue er satellittens bane, med tidspunkterne for dens fremkomst og forsvinden i enderne.  Kun stjerner, der er lyse nok til en tusmørkehimmel, tegnes: en synlig passage sker, mens himlen er halvmørk."
    "Sky dome chart" = "Kort over himmelkuplen"
    "{name} — alt {alt}°, az {az}°, mag {mag}" = "{name} — højde {alt}°, az {az}°, mag {mag}"
    "{name} — alt {alt}°, az {az}°" = "{name} — højde {alt}°, az {az}°"
    "{name} — alt {alt}°, az {az}° — in shadow" = "{name} — højde {alt}°, az {az}° — i Jordens skygge"
    "{name} — alt {alt}°, az {az}°, {pct}% illuminated" = "{name} — højde {alt}°, az {az}°, {pct}% belyst"
    "{name} pass — {rise} → {set}, peak {alt}°" = "{name}-passage — {rise} → {set}, højest {alt}°"
    "Pass sky chart" = "Himmelkort for passagen"
    "{date} · {rise} → {set} · peak {alt}°" = "{date} · {rise} → {set} · højest {alt}°"
    "%b %-d" = "%-d. %b"
    "%a %b %-d" = "%a %-d. %b"
    "overhead now" = "på himlen nu"
    "in {m} min" = "om {m} min"
    "in {h} h" = "om {h} h"
    "in {n} day" = "om {n} dag"
    "in {n} days" = "om {n} dage"
    "just set" = "netop forsvundet"

