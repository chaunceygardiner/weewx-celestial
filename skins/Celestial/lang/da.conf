[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The live sky over {location}." = "Den aktuelle himmel over {location}."
    'Celestial <span class="over">over</span> {location}' = 'Himmellegemer <span class="over">over</span> {location}'
    "updated" = "opdateret"
    "The geocentric · live" = "Geocentrisk (live)"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installer {skyfield} (stærkt anbefalet og påkrævet for Proxima Centauri) eller PyEphem, så almanakken kan levere positioner og afstande til dette panel."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Geocentrisk kort: himmellegemer placeret efter kompasazimut og logaritmisk afstand fra Jorden."
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "Planvisning — himmellegemerne vises efter kompasretning, med øst mod højre. Ringene repræsenterer afstande, der øges ti gange fra ring til ring. Optrukne symboler angiver objekter over horisonten, mens stiplede symboler angiver objekter under horisonten. Sporene viser bevægelsen gennem den seneste time."
    "Calculated with WeeWX's built-in almanac" = "Beregnet med WeeWX's indbyggede almanak."
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Beregningerne er udført ved hjælp af stationens udvidede almanak (weewx-skyfield eller PyEphem)."
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beregnet med Skyfield, JPL's DE421 ephemeris og Hipparcos stjernekatalog (Credit: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beregnet med weewx-skyfield: Skyfield, JPL's DE421 ephemeris og Hipparcos stjernekatalog (Credit: ESA)"
    "live via weewx-loopdata" = "live via weewx-loopdata"

