# skins/Celestial/lang/da.conf
#
# Danish -- the Celestial page's reference dictionary.  Every string the
# page renders is here, and nothing else: tests/test_celestial.py fails if
# a key rendered by index.html.tmpl or realtime_updater.inc is missing
# from this file, or if this file carries a key nothing renders.
#
# Translation contributed by Gert Andersen.
#
# Translations are gettext-style: the English string IS the key, and a
# report falls back to the English, one string at a time, for any key its
# language file does not carry -- a partial translation is fine.
# Composed strings keep their {named} placeholders; translators may
# reorder them but must not rename them.

[Labels]

    # Hemisphere abbreviations, for the latitude/longitude in the header
    hemispheres = N, S, Ø, V

[Units]

    [[Ordinates]]

        # Compass ordinal directions; the dial uses N, E, S and W
        directions = N, NNØ, NØ, ØNØ, Ø, ØSØ, SØ, SSØ, S, SSV, SV, VSV, V, VNV, NV, NNV, N/A

[Almanac]

    # Moon phase names ($almanac.moon_phase -- and any moon_phase loop
    # field of a weewx-loopdata instance whose target report is this one)
    moon_phases = Nymåne, Tiltagende seglmåne, Første kvarter, Tiltagende måne, Fuldmåne, Aftagende måne, Sidste kvarter, Aftagende seglmåne

    # Body display names, keyed by tag name: the dial labels, the roster
    # rows, and the $almanac.<body>.label tag.  proxima_centauri is the
    # full name; the dial and roster use the short [Texts] "Proxima".
    sun = Sol
    moon = Måne
    mercury = Merkur
    venus = Venus
    earth = Jorden
    mars = Mars
    jupiter = Jupiter
    saturn = Saturn
    uranus = Uranus
    neptune = Neptun
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Satellite display names, keyed by the tag names of [Skyfield]
    # [[Satellites]] entries, verbatim from weewx-skyfield.  A
    # satellite without one shows its tag name title-cased.
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Comet display names, keyed by the tag names of [Skyfield]
    # [[Comets]] entries, verbatim from weewx-skyfield.
    halley = Halley
    hale_bopp = Hale-Bopp

    # Constellation display names, keyed by IAU abbreviation, for the
    # $almanac.<body>.constellation.label tag (weewx-skyfield) and its
    # loopdata form almanac.<body>.constellation.label.  The page does not
    # render these itself; they ship so a report in this language serves
    # the full set.  English uses the Latin names, so this section doubles
    # as the key reference; $almanac.<body>.constellation always reports
    # the Latin name.
    # Meteor shower display names, keyed by the shower key, verbatim
    # from weewx-skyfield: almanac.next_meteor_shower.label and the
    # shower countdown chip.
    [[MeteorShowers]]
        quadrantids = Kvadrantider
        lyrids = Lyrider
        eta_aquariids = Eta-akvarider
        delta_aquariids = Sydlige delta-akvarider
        perseids = Perseider
        draconids = Drakonider
        orionids = Orionider
        southern_taurids = Sydlige taurider
        northern_taurids = Nordlige taurider
        leonids = Leonider
        geminids = Geminider
        ursids = Ursider

