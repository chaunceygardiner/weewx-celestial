    "autumn begins" = "efteråret begynder"
    "winter begins" = "vinteren begynder"
    "Earth perihelion" = "Jordens perihelium"
    "Earth aphelion" = "Jordens aphelium"
    "supermoon" = "supermåne"
    "appears in" = "viser sig om"
    "{d}d {h}h {m}m" = "{d}d {h}h {m}m"
    "mag {mag}" = "mag {mag}"
    "moon {pct}%" = "måne {pct}%"
    "lunar eclipse" = "Måneformørkelse"
