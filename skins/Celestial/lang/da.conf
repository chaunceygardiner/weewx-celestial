    # ── the dome's health line (8.3.1): shown when the backdrop
    #    refetches stop landing and the star field is no longer
    #    advancing.  {file} is filled in with the fragment that failed
    #    -- keep the placeholder, never translate or drop it
    #    ─────────────────────────────────────
    "Star field frozen — this sky is from {time} ({why})" = "Stjernefeltet er frosset — denne himmel er fra {time} ({why})"
    "no newer backdrop has arrived" = "der er ikke ankommet nogen nyere baggrund"
    "{file} returns HTTP {status}" = "{file} returnerer HTTP {status}"
    "{file} is not a sky fragment" = "{file} er ikke et himmelfragment"
    "{file} is empty" = "{file} er tom"
    "no response for {file}" = "intet svar for {file}"
    "what to check" = "hvad du skal tjekke"
