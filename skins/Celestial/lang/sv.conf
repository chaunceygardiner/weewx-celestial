# skins/Celestial/lang/sv.conf
#
# Swedish -- Svenska.  The shared vocabulary -- body names, moon phases,
# hemispheres, compass ordinates, all 88 constellation names, and the
# dome and pass strings shared with weewx-skyfield's Sky page -- is
# copied verbatim from weewx-skyfield's lang/sv.conf (Beta pending
# native-speaker review) and must stay in step with it (a test pins
# this).  The handful of strings only this page renders (the badge, the
# dial caption, the roster's motion line) are built from that
# vocabulary.  Corrections welcome at
# https://github.com/chaunceygardiner/weewx-celestial/issues
#
# Keyed by the English strings of lang/en.conf, the reference dictionary;
# a key missing here falls back to English one string at a time.
# Composed strings keep their {named} placeholders: reorder freely, but
# do not rename them.

[Labels]

    # Hemisphere abbreviations, for the latitude/longitude in the header.
    # Swedish coordinates abbreviate east as Ö (östlig längd) …
    hemispheres = N, S, Ö, V

[Units]

    [[Ordinates]]

        # … while the compass winds use O (ost): nordost NO, sydost SO.
        # The dial uses N, O, S and V.
        directions = N, NNO, NO, ONO, O, OSO, SO, SSO, S, SSV, SV, VSV, V, VNV, NV, NNV, N/A

[Almanac]

    # Moon phase names ($almanac.moon_phase -- and any moon_phase loop
    # field of a weewx-loopdata instance whose target report is this one)
    moon_phases = Nymåne, Tilltagande skära, Första kvarteret, Tilltagande måne, Fullmåne, Avtagande måne, Sista kvarteret, Avtagande skära

    # Body display names, keyed by tag name: the dial labels, the roster
    # rows, and the $almanac.<body>.label tag.  proxima_centauri is the
    # full name; the dial and roster use the short [Texts] "Proxima".
    sun = Solen
    moon = Månen
    mercury = Merkurius
    venus = Venus
    earth = Jorden
    mars = Mars
    jupiter = Jupiter
    saturn = Saturnus
    uranus = Uranus
    neptune = Neptunus
    pluto = Pluto
    proxima_centauri = Proxima Centauri

    # Satellite display names, keyed by the tag names of [Skyfield]
    # [[Satellites]] entries, verbatim from weewx-skyfield.  A
    # satellite without one shows its tag name title-cased.
    iss = ISS
    tiangong = Tiangong
    hst = HST

    # Constellation display names, keyed by IAU abbreviation, for the
    # $almanac.<body>.constellation.label tag (weewx-skyfield) and its
    # loopdata form almanac.<body>.constellation.label.  The page does not
    # render these itself; they ship so a report in this language serves
    # the full set.  The IAU standardizes only the Latin names; the
    # Swedish names follow the Swedish Wikipedia's Stjärnbild article
    # (https://sv.wikipedia.org/wiki/Stjärnbild, consulted 2026-08-06).
