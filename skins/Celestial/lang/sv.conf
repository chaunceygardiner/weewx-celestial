[Texts]

    # ── page prose (index.html.tmpl) ─────────────────────────────────────
    "The live sky over {location}." = "Himlen över {location}, live."
    'Celestial <span class="over">over</span> {location}' = 'Himlakroppar <span class="over">över</span> {location}'
    "updated" = "uppdaterad"
    "The geocentric · live" = "Den geocentriska vyn · live"
    "Install {skyfield} (strongly recommended, and required for Proxima Centauri) or PyEphem so the almanac can serve this panel's positions and distances." = "Installera {skyfield} (starkt rekommenderat, och krävs för Proxima Centauri) eller PyEphem så att almanackan kan leverera panelens positioner och avstånd."
    "Geocentric chart: bodies placed by compass azimuth and log distance from Earth" = "Geocentrisk karta: himlakroppar placerade efter kompassazimut och logaritmiskt avstånd från Jorden"
    "plan view — compass bearing, east to the right · rings step ×10 in distance · solid&nbsp;=&nbsp;above the horizon, dashed&nbsp;=&nbsp;below · trails show the last hour of motion" = "sedd ovanifrån — kompassriktning, öster till höger · varje ring ×10 i avstånd · heldragen&nbsp;=&nbsp;över horisonten, streckad&nbsp;=&nbsp;under · spåren visar den senaste timmens rörelse"
    "Calculated with WeeWX's built-in almanac" = "Beräknat med WeeWX:s inbyggda almanacka"
    "Calculated with the station's extended almanac (weewx-skyfield or PyEphem)" = "Beräknat med stationens utökade almanacka (weewx-skyfield eller PyEphem)"
    "Calculated with Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beräknat med Skyfield, JPL:s DE421-efemerid och Hipparcos-stjärnkatalogen (källa: ESA)"
    "Calculated with weewx-skyfield: Skyfield, JPL's DE421 ephemeris and the Hipparcos star catalog (Credit: ESA)" = "Beräknat med weewx-skyfield: Skyfield, JPL:s DE421-efemerid och Hipparcos-stjärnkatalogen (källa: ESA)"
    "live via weewx-loopdata" = "live via weewx-loopdata"

    # ── live strings (realtime_updater.inc; the roster's first paint in
    #    index.html.tmpl uses the same keys) ────────────────────────────
    "alt {alt}°" = "höjd {alt}°"
    "below horizon" = "under horisonten"
    "{dist} au" = "{dist} AE"
    "receding" = "avlägsnar sig"
    "approaching" = "närmar sig"
    "LIVE" = "LIVE"
    "{age}s ago" = "för {age} s sedan"
    "NO DATA (HTTP {status}) — check loop_data_file" = "INGA DATA (HTTP {status}) — kontrollera loop_data_file"
    "BAD DATA — check loop_data_file" = "OGILTIGA DATA — kontrollera loop_data_file"
    "OFFLINE" = "OFFLINE"
    "CLICK-ME" = "KLICKA HÄR"
    "{ly} ly" = "{ly} ly"
    "Proxima" = "Proxima"

    # ── sky dome panel (mined verbatim from weewx-skyfield's sv.conf where
    #    shared; the eyebrow and the install hint are celestial's own) ────
    "The sky dome · live" = "Himlavalvet · live"
    "Install {skyfield} so the almanac can draw the live sky dome." = "Installera {skyfield} så att almanackan kan rita himlavalvet live."
    "North at the top, east at the left — the sky-chart orientation, as if lying on your back looking up.  Altitude rings at 30° and 60°; the rim is the horizon." = "Norr överst, öster till vänster — stjärnkartans orientering, som om du låg på rygg och tittade upp.  Höjdringar vid 30° och 60°; kanten är horisonten."
    "Hover or tap any mark for its coordinates." = "Håll pekaren över eller tryck på en markering för att se dess koordinater."
    "Satellites · the next visible pass" = "Satelliter · nästa synliga passage"
    "appears {rise} · peaks {alt}° {culm} · disappears {set} · {m} min" = "dyker upp {rise} · högst {alt}° {culm} · försvinner {set} · {m} min"
    "no visible pass in the coming week" = "ingen synlig passage under den kommande veckan"

    # ── the dome's any-pass roster (celestial's own wording -- skyfield's
    #    page has no next_pass table) ──────────────────────────────────
    "Satellites · the next pass overhead" = "Satelliter · nästa passage"
    "no pass in the coming week" = "ingen passage under den kommande veckan"
    "visible" = "synlig"
    "not visible" = "inte synlig"
    "no usable orbital elements — see the weewxd log" = "inga användbara banelement — se weewxd-loggen"

    # ── the Next Visible Pass chart panel (index.html.tmpl; both strings shared
    #    with weewx-skyfield's Sky page, translations verbatim) ─────────
    "The Next Visible Pass · the sky at its peak" = "Nästa synliga passage · himlen vid högsta punkten"
    "The whole sky as it will stand at the pass's highest point, on the date above — the dashed arc is the satellite's path, its rise and set times at the ends.  Only stars bright enough for a twilight sky are drawn: a visible pass happens while your sky is half dark." = "Hela himlen som den kommer att stå vid passagens högsta punkt, på datumet ovanför — den streckade bågen är satellitens bana, med tiderna då den dyker upp och försvinner i ändarna.  Bara stjärnor som är ljusa nog för en skymningshimmel ritas: en synlig passage sker medan himlen är halvmörk."
    "Sky dome chart" = "Karta över himlavalvet"
    "{name} — alt {alt}°, az {az}°, mag {mag}" = "{name} — höjd {alt}°, az {az}°, mag {mag}"
    "{name} — alt {alt}°, az {az}°" = "{name} — höjd {alt}°, az {az}°"
    "{name} — alt {alt}°, az {az}° — in shadow" = "{name} — höjd {alt}°, az {az}° — i jordskuggan"
    "{name} — alt {alt}°, az {az}°, {pct}% illuminated" = "{name} — höjd {alt}°, az {az}°, {pct}% belyst"
    "{name} pass — {rise} → {set}, peak {alt}°" = "{name}-passage — {rise} → {set}, högst {alt}°"
    "Pass sky chart" = "Himmelskarta för passagen"
    "{date} · {rise} → {set} · peak {alt}°" = "{date} · {rise} → {set} · högst {alt}°"
    "%b %-d" = "%-d %b"
    "%a %b %-d" = "%a %-d %b"
    "overhead now" = "på himlen nu"
    "in {m} min" = "om {m} min"
    "in {h} h" = "om {h} h"
    "in {n} day" = "om {n} dag"
    "in {n} days" = "om {n} dagar"
    "just set" = "försvann nyss"
