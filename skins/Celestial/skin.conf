# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Override per report in weewx.conf ([StdReport] [[CelestialReport]]).
lang = en

# The page's plate: dark (the night page, and the default), light (the
# paper-atlas page), or auto -- light while the sun is up at generation
# time, dark otherwise, flipping within one archive interval of
# sunrise/sunset.  The WHOLE page follows it, the embedded sky dome and
# Next Visible Pass chart included: they are rendered on weewx-skyfield's
# matching palette, never left on the night plate inside a light page.
# Spelled and valued exactly as weewx-skyfield's Sky page spells it
# ([StdReport] [[SkyfieldReport]] theme), so the two pages configure
# alike; weewx-skyfield reads this option straight out of this report's
# own configuration, so it needs that extension (without it the page has
# no charts to match, and stays dark).
# It is resolved at GENERATION time, not in the browser: the charts arrive
# as SVG with their colors already inside them, so there is nothing for a
# browser-side toggle to switch.
# Override per report in weewx.conf ([StdReport] [[CelestialReport]]).
theme = dark

[Extras]
    version = 8.4

    # File path of loop data file.  If not a full path,
    # it will be interpreted as relative to this skin's HTML_ROOT.
    # The default is where stock weewx-loopdata writes: its own report's
    # directory ([LoopData] [[FileSpec]] loop_data_dir = .).  The
    # installer derives this from your own configuration; it is only the
    # fallback for a station the installer could not read.
    loop_data_file = '../loopdata/loop-data.txt'

    # Seconds between loop-data polls.  Match weewx-loopdata's write
    # cadence (2 seconds for the Vantage driver).
    refresh_rate = 2

    # Timezone for every time shown on the page (rise/set cells, day strip,
    # clock).  By default the STATION's timezone is auto-detected at report
    # generation time, so remote viewers of a public page see station time
    # -- no setting needed.  Uncomment only to override: an IANA name
    # (e.g., 'America/New_York') forces that zone; 'browser' forces the
    # viewer's browser-local timezone.
    # time_zone = 'browser'

    # Choose your own password.  without ?page_update_pwd='xxx'
    # at the end of the URL, auto updating will timeout.
    # Note: This password will be viaible to users looking
    # at page source in their browser.
    page_update_pwd = 'foobar'

    # Page expiration time is the number of hours the report will request
    # loop data and update.  After which, a mouse click will be needed
    # to start refreshing again.  Default 24 hours.
    expiration_time = 24

[CheetahGenerator]
    encoding = html_entities
    # Guarded access to weewx-skyfield's $sky_page (None when skyfield is
    # absent).  NEVER name user.wxskyfield_sky here directly: a failed
    # import at report time would kill the whole page.
    search_list_extensions = user.celestial_sky.CelestialSkyPage
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        ## The dome backdrop, regenerated each report cycle for the open
        ## page's javascript to refetch (.txt keeps the html-validator
        ## cron away from a bare SVG fragment).  Ten staggered slots per
        ## cycle, spaced max(60 s, interval/10), so the open page steps
        ## the sky smoothly instead of lurching once per cycle; slots
        ## beyond the archive interval render empty (dome-svg-frag.inc).
        [[[dome]]]
            template = dome-svg.txt.tmpl
        [[[dome_1]]]
            template = dome-svg-1.txt.tmpl
        [[[dome_2]]]
            template = dome-svg-2.txt.tmpl
        [[[dome_3]]]
            template = dome-svg-3.txt.tmpl
        [[[dome_4]]]
            template = dome-svg-4.txt.tmpl
        [[[dome_5]]]
            template = dome-svg-5.txt.tmpl
        [[[dome_6]]]
            template = dome-svg-6.txt.tmpl
        [[[dome_7]]]
            template = dome-svg-7.txt.tmpl
        [[[dome_8]]]
            template = dome-svg-8.txt.tmpl
        [[[dome_9]]]
            template = dome-svg-9.txt.tmpl
        ## The Next Visible Pass chart, likewise refetched: a completed pass's
        ## chart is replaced by the next one, and an empty fragment (no
        ## visible pass in the elements' validity window) hides the panel.
        [[[pass_chart]]]
            template = pass-chart.txt.tmpl

[CopyGenerator]
    copy_once = celestial.css, sky.js
    copy_always = ,

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
