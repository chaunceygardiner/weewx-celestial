# The page's language: WeeWX merges lang/<lang>.conf over this skin.conf.
# Override per report in weewx.conf ([StdReport] [[CelestialReport]]).
lang = en

# The page's plate: dark (the night page, and the default), light (the
# paper-atlas page), or auto -- light while the sun is up at generation
# time, dark otherwise, flipping within one archive interval of
# sunrise/sunset.  The WHOLE page follows it, the embedded sky dome and
# Next Visible Pass chart included: they are rendered on weewx-skyfield's
# matching palette, never left on the night plate inside a light page.
# Spelled and valued exactly as weewx-skyfield's Sky page spells it
# ([StdReport] [[SkyfieldReport]] theme), so the two pages configure
# alike; weewx-skyfield reads this option straight out of this report's
# own configuration, so it needs that extension (without it the page has
# no charts to match, and stays dark).
# It is resolved at GENERATION time, not in the browser: the charts arrive
# as SVG with their colors already inside them, so there is nothing for a
# browser-side toggle to switch.
# Override per report in weewx.conf ([StdReport] [[CelestialReport]]).
theme = dark

[Extras]
    version = 8.5

    # File path of loop data file.  If not a full path,
    # it will be interpreted as relative to this skin's HTML_ROOT.
    # The default is where stock weewx-loopdata writes: its own report's
    # directory ([LoopData] [[FileSpec]] loop_data_dir = .).  The
    # installer derives this from your own configuration; it is only the
    # fallback for a station the installer could not read.
    loop_data_file = '../loopdata/loop-data.txt'

    # Seconds between loop-data polls.  Match weewx-loopdata's write
    # cadence (2 seconds for the Vantage driver).
    refresh_rate = 2

    # Timezone for every time shown on the page (rise/set cells, day strip,
    # clock).  By default the STATION's timezone is auto-detected at report
    # generation time, so remote viewers of a public page see station time
    # -- no setting needed.  Uncomment only to override: an IANA name
    # (e.g., 'America/New_York') forces that zone; 'browser' forces the
    # viewer's browser-local timezone.
    # time_zone = 'browser'

    # PLACEHOLDER -- choose your own password.  Loading the page as
    # ?pageUpdate=<this password> exempts it from expiring, which is what
    # a kiosk display wants.  Note the URL parameter is pageUpdate, not
    # page_update_pwd.  The password is visible to anyone reading the
    # page source.
    page_update_pwd = 'foobar'

    # Page expiration time is the number of hours the report will request
    # loop data and update.  After which, a mouse click will be needed
    # to start refreshing again.  Default 24 hours.
    expiration_time = 24

# The fields the page reads, declared to weewx-loopdata (7.0 and later),
# which evaluates them on every loop packet and writes them into the
# loop-data file under this REPORT's name, rendered with this report's
# own units, formats, [Texts] and [Almanac] names.  Named groups, one per
# panel; the names are for the reader (ConfigObj has no line continuation
# for lists), and a field in two groups counts once.  Only what does not
# depend on your configuration is here: the satellite and comet fields
# follow your [Skyfield] [[Satellites]] and [[Comets]], so the installer
# writes them into weewx.conf as two more groups of this report's own
# ([StdReport] [[CelestialReport]] [[[LoopData]]] [[[[fields]]]]
# satellites and comets) -- see the manual's Fields reference.  A field
# of your own belongs in a group of your own, there too, never in this
# file, which the next upgrade overwrites.
[LoopData]
    [[fields]]
        # The packet's timestamp: the page's clock, the LIVE badge's age
        # and the extrapolation anchor.
        clock = current.dateTime.raw
        # The Geocentric dial and its roster: azimuth places the mark,
        # altitude decides above/below the horizon, earth_distance (raw
        # astronomical units) drives the odometer.  The moon adds its
        # phase percent and the next full/new moon instants (waxing =
        # full before new) for the phase disc.
        sun = almanac.sun.az, almanac.sun.alt, almanac.sun.earth_distance
        moon = almanac.moon.az, almanac.moon.alt, almanac.moon.earth_distance, almanac.moon.phase, almanac.next_full_moon.unix_epoch.raw, almanac.next_new_moon.unix_epoch.raw
        mercury = almanac.mercury.az, almanac.mercury.alt, almanac.mercury.earth_distance
        venus = almanac.venus.az, almanac.venus.alt, almanac.venus.earth_distance
        mars = almanac.mars.az, almanac.mars.alt, almanac.mars.earth_distance
        jupiter = almanac.jupiter.az, almanac.jupiter.alt, almanac.jupiter.earth_distance
        saturn = almanac.saturn.az, almanac.saturn.alt, almanac.saturn.earth_distance
        uranus = almanac.uranus.az, almanac.uranus.alt, almanac.uranus.earth_distance
        neptune = almanac.neptune.az, almanac.neptune.alt, almanac.neptune.earth_distance
        pluto = almanac.pluto.az, almanac.pluto.alt, almanac.pluto.earth_distance
        proxima_centauri = almanac.proxima_centauri.az, almanac.proxima_centauri.alt, almanac.proxima_centauri.earth_distance
        # The countdown row: each chip is client-side arithmetic against
        # one of these event instants, pinned to epoch seconds
        # (.unix_epoch) because the page does date math on them.  The
        # two almanac(horizon=-18) spellings must stay exactly as written:
        # the javascript looks them up by that literal key.
        sunset = almanac.sun.next_setting.unix_epoch.raw, almanac.sun.next_rising.unix_epoch.raw
        darkness = almanac(horizon=-18).sun.next_setting.unix_epoch.raw, almanac(horizon=-18).sun.next_rising.unix_epoch.raw
        season = almanac.next_equinox.unix_epoch.raw, almanac.next_solstice.unix_epoch.raw
        perihelion = almanac.next_perihelion.unix_epoch.raw, almanac.next_aphelion.unix_epoch.raw
        meteor_shower = almanac.next_meteor_shower.peak.unix_epoch.raw, almanac.next_meteor_shower.label
        supermoon = almanac.next_supermoon.unix_epoch.raw
        eclipse = almanac.next_eclipse.unix_epoch.raw, almanac.next_eclipse_kind

[CheetahGenerator]
    encoding = html_entities
    # Guarded access to weewx-skyfield's $sky_page (None when skyfield is
    # absent).  NEVER name user.wxskyfield_sky here directly: a failed
    # import at report time would kill the whole page.
    search_list_extensions = user.celestial_sky.CelestialSkyPage
    [[ToDate]]
        [[[index]]]
            template = index.html.tmpl
        ## The dome backdrop, regenerated each report cycle for the open
        ## page's javascript to refetch (.txt keeps the html-validator
        ## cron away from a bare SVG fragment).  Ten staggered slots per
        ## cycle, spaced max(60 s, interval/10), so the open page steps
        ## the sky smoothly instead of lurching once per cycle; slots
        ## beyond the archive interval render empty (dome-svg-frag.inc).
        [[[dome]]]
            template = dome-svg.txt.tmpl
        [[[dome_1]]]
            template = dome-svg-1.txt.tmpl
        [[[dome_2]]]
            template = dome-svg-2.txt.tmpl
        [[[dome_3]]]
            template = dome-svg-3.txt.tmpl
        [[[dome_4]]]
            template = dome-svg-4.txt.tmpl
        [[[dome_5]]]
            template = dome-svg-5.txt.tmpl
        [[[dome_6]]]
            template = dome-svg-6.txt.tmpl
        [[[dome_7]]]
            template = dome-svg-7.txt.tmpl
        [[[dome_8]]]
            template = dome-svg-8.txt.tmpl
        [[[dome_9]]]
            template = dome-svg-9.txt.tmpl
        ## The Next Visible Pass chart, likewise refetched: a completed pass's
        ## chart is replaced by the next one, and an empty fragment (no
        ## visible pass in the elements' validity window) hides the panel.
        [[[pass_chart]]]
            template = pass-chart.txt.tmpl

[CopyGenerator]
    copy_once = celestial.css, sky.js
    copy_always = ,

[Generators]
        generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
